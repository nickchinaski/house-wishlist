<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>House Wishlist</title>
<style>
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --surface-2: #EAF0EE; --ink: #17222A; --muted: #5B6A71; --line: #D8E0DD;
  --accent: #2C6B5B; --accent-ink: #FFFFFF; --must: #B93A26; --must-bg: #FBE7E3; --imp: #A86A12; --imp-bg: #FBF0DC;
  --nice: #3563A8; --nice-bg: #E3ECF8; --ok: #2B7A4B; --ok-bg: #DDF1E4; --warn: #8A6400; --warn-bg: #FFF4CF;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0F1518; --surface: #172026; --surface-2: #1E2A31; --ink: #E6ECEA; --muted: #95A4AA; --line: #2A3740;
  --accent: #6BC0A5; --accent-ink: #0D1B16; --must: #F1806B; --must-bg: #3A201B; --imp: #E5B451; --imp-bg: #362A14;
  --nice: #86ADEB; --nice-bg: #1C2A40; --ok: #73D198; --ok-bg: #16301F; --warn: #EBC35A; --warn-bg: #3A3014; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; width: 380px; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
header a { color: var(--accent); font-size: 12px; text-decoration: none; font-weight: 600; }
main { padding: 12px 14px 14px; display: grid; gap: 10px; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 18px 0; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.head { display: flex; gap: 10px; align-items: center; }
.pth { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.note { font-size: 12px; border-radius: 8px; padding: 7px 9px; background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--must-bg); color: var(--must); }
.note.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; font-size: 13px; }
label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
input, select { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 9px; font: inherit; }
.row { display: grid; grid-template-columns: 1fr 70px; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1 1 auto; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); padding: 6px 7px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.prio button[data-v="Must-have"][aria-pressed="true"] { background: var(--must-bg); color: var(--must); }
.seg.prio button[data-v="Important"][aria-pressed="true"] { background: var(--imp-bg); color: var(--imp); }
.seg.prio button[data-v="Nice-to-have"][aria-pressed="true"] { background: var(--nice-bg); color: var(--nice); }
.acts { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; }
.btn:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.hlinks { display: flex; gap: 12px; align-items: center; }
.setup p { margin: 0; color: var(--muted); }
.setup b { color: var(--ink); }
</style>
</head>
<body>
<header><h1>🏠 House Wishlist</h1><span class="hlinks"><a href="#" id="openList">Open list ↗</a><a href="#" id="changeList" title="Use a different list">⚙</a></span></header>
<main id="main"><div class="status"><span class="spin"></span>Reading the page…</div></main>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
